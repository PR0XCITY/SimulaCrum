name: GhostOps gate
description: >-
  Plan a Terraform directory against MiniStack (fake credentials only), risk-check it with the
  GhostOps CLI and fail when the verdict is BLOCKED_PENDING_REVIEW. Writes a job summary.
  Needs a MiniStack service container on localhost:4566 and a Linux x64 runner.

inputs:
  tf-dir:
    description: Terraform directory to check (relative to the workspace)
    required: true
  ghostops-path:
    description: Where the GhostOps repository is checked out (relative to the workspace)
    required: false
    default: .
  expect:
    description: >-
      Optional. AUTO_APPROVED or BLOCKED_PENDING_REVIEW: pass only if the verdict is this one
      (used to self-test demo/bad). Empty means a normal gate (blocked fails the job).
    required: false
    default: ""
  groq-api-key:
    description: Optional Groq key for the plain-English explanation (template text without it)
    required: false
    default: ""
  signing-key:
    description: >-
      Optional Ed25519 key (base64, `python -m app.keys generate`). Certificates can then be
      verified by anyone with the public key. Preferred over hmac-secret.
    required: false
    default: ""
  hmac-secret:
    description: Optional HMAC secret. With neither key, a random per-run HMAC secret is used.
    required: false
    default: ""

outputs:
  verdict:
    description: AUTO_APPROVED, BLOCKED_PENDING_REVIEW or ERROR
    value: ${{ steps.gate.outputs.verdict }}
  plan-id:
    description: Certificate id (sha256 of the plan JSON)
    value: ${{ steps.gate.outputs.plan-id }}
  certificate:
    description: Path of the certificate JSON
    value: ${{ steps.gate.outputs.certificate }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    # Same pinned versions and SHA-256 checksums as backend/Dockerfile.
    - name: Install terraform and opa (pinned, checksum verified)
      shell: bash
      env:
        TERRAFORM_VERSION: "1.16.4"
        TERRAFORM_SHA256: dc94af0eef1147718ad7c8daea792ed199e3e0492eec180d0adafa2a65a879df
        OPA_VERSION: "1.21.1"
        OPA_SHA256: 668506eb17a2eaa1fce6cc0d1f42ef85125d4ac5bda5fc74d1152d0c77145031
      run: |
        set -euo pipefail
        if [ "$RUNNER_OS" != "Linux" ] || [ "$RUNNER_ARCH" != "X64" ]; then
          echo "::error::the GhostOps gate action supports Linux x64 runners only"; exit 2
        fi
        bin="$RUNNER_TEMP/ghostops-bin"; mkdir -p "$bin"; cd "$RUNNER_TEMP"
        curl -fsSLo terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
        echo "${TERRAFORM_SHA256}  terraform.zip" | sha256sum -c -
        unzip -oq terraform.zip terraform -d "$bin"
        curl -fsSLo "$bin/opa" "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
        echo "${OPA_SHA256}  $bin/opa" | sha256sum -c -
        chmod 0755 "$bin/terraform" "$bin/opa"
        echo "$bin" >> "$GITHUB_PATH"

    - name: Install GhostOps
      shell: bash
      env:
        GHOSTOPS_PATH: ${{ inputs.ghostops-path }}
      run: python -m pip install --disable-pip-version-check -q -e "$GHOSTOPS_PATH/backend"

    - name: Signing key
      shell: bash
      env:
        GIVEN_KEY: ${{ inputs.signing-key }}
        GIVEN_SECRET: ${{ inputs.hmac-secret }}
      run: |
        if [ -n "$GIVEN_KEY" ]; then
          echo "::add-mask::$GIVEN_KEY"
          echo "GHOSTOPS_SIGNING_KEY=$GIVEN_KEY" >> "$GITHUB_ENV"
        else
          secret="${GIVEN_SECRET:-$(python -c 'import secrets; print(secrets.token_hex(32))')}"
          echo "::add-mask::$secret"
          echo "GHOSTOPS_HMAC_SECRET=$secret" >> "$GITHUB_ENV"
        fi

    - uses: actions/cache@v4
      with:
        path: ${{ inputs.ghostops-path }}/.terraform-plugin-cache
        key: ghostops-tf-1.16.4-${{ runner.os }}-${{ hashFiles(format('{0}/**/*.tf', inputs.tf-dir)) }}
        restore-keys: ghostops-tf-1.16.4-${{ runner.os }}-

    - name: Wait for MiniStack
      shell: bash
      run: |
        for i in $(seq 1 30); do
          curl -fs http://localhost:4566/_ministack/health >/dev/null && exit 0
          sleep 2
        done
        echo "::error::MiniStack is not reachable on localhost:4566 (add the service container)"
        exit 2

    - name: GhostOps gate
      id: gate
      shell: bash
      env:
        # Fake credentials only. The gate also scrubs AWS_* and forces every endpoint to MiniStack.
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_DEFAULT_REGION: us-east-1
        MINISTACK_ENDPOINT_URL: http://localhost:4566
        GROQ_API_KEY: ${{ inputs.groq-api-key }}
        TF_DIR: ${{ github.workspace }}/${{ inputs.tf-dir }}
        EXPECT: ${{ inputs.expect }}
        GHOSTOPS_PATH: ${{ inputs.ghostops-path }}
      run: |
        args=(ci --tf "$TF_DIR" --out-dir "$RUNNER_TEMP/ghostops-gate"
              --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT")
        if [ -z "$GROQ_API_KEY" ]; then args+=(--no-groq); fi
        if [ -n "$EXPECT" ]; then args+=(--expect "$EXPECT"); fi
        cd "$GHOSTOPS_PATH/backend"
        python -m app.gate "${args[@]}"
