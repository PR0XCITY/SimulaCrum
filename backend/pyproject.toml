[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostops"
version = "0.7.0"
description = "Safety layer between an AI coding agent and a cloud account"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40",
    "networkx>=3.3",
    "cryptography>=43",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.2",  # Postgres store, used only when GHOSTOPS_DATABASE_URL is set
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
ghostops = "app.cli:main"

[tool.setuptools]
packages = ["app"]
